<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gebed</title>
<style>
:root {
  --base00: #1e1e2e; --base01: #181825; --base02: #313244; --base03: #45475a;
  --base04: #585b70; --base05: #cdd6f4; --base08: #f38ba8; --base09: #fab387;
  --base0A: #f9e2af; --base0B: #a6e3a1; --base0C: #94e2d5; --base0D: #89b4fa; --base0E: #cba6f7;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--base00); color: var(--base05); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
.id, .key, .mode, .prio, .kind, .vname, .wd, .wm { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.root { display: flex; flex-direction: column; height: 100vh; }
.app { flex: 1; min-height: 0; display: flex; }
.dim { color: var(--base04); }
.error { color: var(--base08); padding: 1em; }
.id { color: var(--base0D); font-size: 12px; }

/* status bar: always on top, vim style */
.bar { display: flex; align-items: center; gap: 14px; padding: 0 12px 0 0; background: var(--base01); border-bottom: 1px solid var(--base02); height: 30px; font-size: 12px; white-space: nowrap; overflow: hidden; }
.mode { padding: 0 12px; height: 100%; display: flex; align-items: center; font-weight: bold; color: var(--base00); background: var(--base0D); }
.mode.insert { background: var(--base0B); }
.mode.drag { background: var(--base09); }
.pending { color: var(--base0A); min-width: 0; }
.vname { color: var(--base0E); font-weight: bold; }
.stats { display: flex; gap: 10px; color: var(--base05); }
.stat + .stat::before { content: "·"; color: var(--base04); margin-right: 10px; }
.hints { margin-left: auto; display: flex; gap: 12px; color: var(--base04); overflow: hidden; }
.hint .key { color: var(--base0D); }
.sponsor { flex: none; margin-left: 4px; padding: 2px 12px; border-radius: 999px; background: var(--base08); color: var(--base00); font-weight: bold; text-decoration: none; }
.sponsor:hover { filter: brightness(1.12); }

.sidebar { width: 13em; flex: none; background: var(--base01); padding: 8px; overflow: auto; border-right: 1px solid var(--base02); }
ul { list-style: none; margin: 0; padding: 0; }
.sidebar li { padding: 5px 8px; border-radius: 4px; cursor: pointer; }
.sidebar li.current { background: var(--base02); }
.main { flex: 1; min-width: 0; overflow: auto; }

/* chips, badges */
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip { display: inline-block; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; border-radius: 999px; font-size: 11px; line-height: 18px; border: 1px solid currentColor; }
.lc0 { color: var(--base08); background: color-mix(in srgb, var(--base08) 14%, transparent); }
.lc1 { color: var(--base09); background: color-mix(in srgb, var(--base09) 14%, transparent); }
.lc2 { color: var(--base0A); background: color-mix(in srgb, var(--base0A) 14%, transparent); }
.lc3 { color: var(--base0B); background: color-mix(in srgb, var(--base0B) 14%, transparent); }
.lc4 { color: var(--base0C); background: color-mix(in srgb, var(--base0C) 14%, transparent); }
.lc5 { color: var(--base0D); background: color-mix(in srgb, var(--base0D) 14%, transparent); }
.lc6 { color: var(--base0E); background: color-mix(in srgb, var(--base0E) 14%, transparent); }
.prio { display: inline-block; min-width: 26px; text-align: center; padding: 0 5px; border-radius: 4px; font-size: 11px; font-weight: bold; line-height: 18px; color: var(--base00); }
.p0 { background: var(--base08); } .p1 { background: var(--base09); } .p2 { background: var(--base0A); }
.p3 { background: var(--base0D); } .p4 { background: var(--base04); color: var(--base05); }
.kind { color: var(--base04); font-size: 11px; }

/* kanban */
.kanban { display: flex; gap: 12px; padding: 12px; align-items: flex-start; min-height: 100%; }
.col { flex: 1 1 0; min-width: 230px; max-width: 360px; background: var(--base01); border-radius: 8px; border-top: 3px solid var(--base04); padding: 8px; }
.col.st-open { border-top-color: var(--base0D); } .col.st-doing { border-top-color: var(--base0A); }
.col.st-blocked { border-top-color: var(--base08); } .col.st-done { border-top-color: var(--base0B); }
.colhead { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 8px; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: .06em; }
.colcount { color: var(--base04); background: var(--base02); border-radius: 999px; padding: 0 8px; font-size: 11px; }
.colempty { color: var(--base04); font-size: 12px; padding: 14px 6px; text-align: center; border: 1px dashed var(--base03); border-radius: 6px; }
.card { background: var(--base02); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; border: 1px solid transparent; cursor: pointer; }
.card:hover { border-color: var(--base03); }
.card.current { border-color: var(--base0D); box-shadow: 0 0 0 1px var(--base0D); }
.cardtop { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.cardtop .kind { margin-left: auto; }
.ctitle { font-weight: 500; margin-bottom: 6px; overflow-wrap: anywhere; }
.cardfoot { display: flex; gap: 12px; color: var(--base04); font-size: 11px; margin-top: 6px; }
.cardfoot span:empty { display: none; }
.cardfoot span:last-child { margin-left: auto; }

/* list */
.list { padding: 8px 12px; }
.lrow { display: grid; grid-template-columns: 36px 84px 96px minmax(180px, 1fr) minmax(120px, 220px) 110px 56px; gap: 12px; align-items: center; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.lrow:nth-child(even) { background: color-mix(in srgb, var(--base01) 70%, transparent); }
.lrow.current { background: var(--base02); box-shadow: inset 3px 0 0 var(--base0D); }
.lhead { color: var(--base04); font-size: 11px; letter-spacing: .08em; cursor: default; background: none !important; border-bottom: 1px solid var(--base02); border-radius: 0; }
.ltitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.status { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.status.st-open { color: var(--base0D); } .status.st-doing { color: var(--base0A); }
.status.st-blocked { color: var(--base08); } .status.st-done { color: var(--base0B); } .status.st-other { color: var(--base04); }

/* empty states */
.empty { padding: 2em; line-height: 1.7; }
.dtitle { font-weight: bold; margin-bottom: .2em; }

/* detail */
.detail { width: 38em; flex: none; background: var(--base01); padding: 10px 14px; overflow: auto; border-left: 1px solid var(--base02); }
.dmeta { margin-bottom: .2em; }
.ddesc { white-space: pre-wrap; margin: .5em 0; padding: .5em; background: var(--base02); border-radius: 6px; }
.discussion { margin-top: .6em; }
.comment { margin-bottom: .8em; }
.author { color: var(--base0B); font-weight: 600; }
.ctext { white-space: pre-wrap; }
.hint { margin-top: .8em; }
.composer { margin-top: .8em; }
.composer textarea { width: 100%; background: var(--base02); color: var(--base05); border: 1px solid var(--base03); border-radius: 6px; font: inherit; padding: .5em; }
.composer .chip { cursor: pointer; margin-right: 6px; color: var(--base0D); }

/* popup + flash */
.whichkey { position: fixed; left: 0; right: 0; bottom: 0; background: var(--base02); padding: .6em 1em; display: flex; flex-wrap: wrap; gap: 1.5em; border-top: 1px solid var(--base03); }
.wk .key { color: var(--base0D); }
.flash { position: fixed; right: 1em; bottom: 3em; background: var(--base02); color: var(--base0B); padding: .5em .9em; border-left: 3px solid var(--base0B); border-radius: 4px; }

/* graph */
.edge { stroke: var(--base04); fill: none; stroke-width: 1.5; }
.edge.soft { stroke-dasharray: 4 3; }
.gnode { fill: var(--base01); stroke: var(--base03); }
.gnode.current { stroke: var(--base0D); stroke-width: 2; }
.gid { fill: var(--base0D); font: 11px monospace; }
.gtitle { fill: var(--base05); font: 12px monospace; }
.gext { fill: var(--base0E); font: 10px monospace; }

/* waterfall */
.wf { height: 100%; overflow: auto; position: relative; }
.wrow { display: flex; width: max-content; min-width: 100%; align-items: stretch; height: 30px; border-bottom: 1px solid color-mix(in srgb, var(--base02) 60%, transparent); }
.wrow.current { background: color-mix(in srgb, var(--base02) 60%, transparent); }
.wlabel { position: sticky; left: 0; z-index: 3; width: 260px; flex: none; padding: 5px 10px; background: var(--base00); border-right: 1px solid var(--base02); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.wrow.current .wlabel { background: var(--base02); }
.wruler { position: sticky; top: 0; z-index: 5; height: 46px; background: var(--base01); border-bottom: 1px solid var(--base03); }
.wruler .wlabel { background: var(--base01); cursor: default; }
.wtrack { position: relative; flex: none; background-image: linear-gradient(to right, color-mix(in srgb, var(--base02) 70%, transparent) 1px, transparent 1px); background-size: var(--cw, 40px) 100%; }
.wruler .wtrack { background-image: none; }
.wmonths, .wdays { display: flex; height: 23px; }
.wm { width: var(--cw, 40px); flex: none; overflow: visible; white-space: nowrap; font-size: 11px; color: var(--base0E); padding: 4px 0 0 2px; }
.wd { width: var(--cw, 40px); flex: none; text-align: center; font-size: 11px; color: var(--base04); padding-top: 3px; border-left: 1px solid color-mix(in srgb, var(--base02) 70%, transparent); }
.wd.wend { color: var(--base03); }
.wd.wnow { background: var(--base0D); color: var(--base00); font-weight: bold; border-radius: 3px; }
.wtoday { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--base0D); opacity: .55; z-index: 1; }
.wbar { position: absolute; top: 4px; height: 22px; border-radius: 5px; padding: 0 8px; line-height: 22px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--base00); cursor: grab; z-index: 2; user-select: none; }
.wbar:active, .wbar.dragging { cursor: grabbing; opacity: .85; }
.wbar-open { background: var(--base0D); } .wbar-doing { background: var(--base0A); }
.wbar-blocked { background: var(--base08); } .wbar-done { background: var(--base0B); } .wbar-other { background: var(--base04); color: var(--base05); }
.wbar.unsched { background: transparent; color: var(--base04); border: 1px dashed var(--base04); }
.wbar.late { box-shadow: 0 0 0 2px var(--base08); }
.wbar.current { outline: 2px solid var(--base05); outline-offset: 1px; }

/* epics as tags */
.chip.epictag { color: var(--base0E); background: color-mix(in srgb, var(--base0E) 18%, transparent); font-weight: 600; }
.card.isepic { border-left: 3px solid var(--base0E); }
.colnote { color: var(--base04); font-size: 11px; padding: 0 4px 8px; }
.col.st-epic { border-top-color: var(--base0E); }

/* epics view */
.epics { padding: 12px 16px; display: flex; flex-direction: column; gap: 16px; max-width: 980px; }
.epic { background: var(--base01); border-radius: 8px; padding: 10px 12px; }
.epichead { display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.epichead.current, .echild.current { background: var(--base02); box-shadow: inset 3px 0 0 var(--base0D); }
.etitle { font-weight: 600; flex: 1; }
.epct { color: var(--base04); font-size: 12px; }
.bar-stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--base02); margin: 6px 6px 8px; }
.seg.done { background: var(--base0B); } .seg.doing { background: var(--base0A); } .seg.blocked { background: var(--base08); } .seg.open { background: var(--base0D); opacity: .5; }
.echildren { display: flex; flex-direction: column; }
.echild { display: grid; grid-template-columns: 36px 90px 70px 1fr; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; }

/* flow metrics */
.flow { padding: 14px 18px; display: flex; flex-direction: column; gap: 22px; }
.chart .ctitle { color: var(--base0E); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
.svgchart { background: var(--base01); border-radius: 6px; }
.axis { stroke: var(--base03); } .axistext { fill: var(--base04); font: 10px monospace; }
.line { fill: none; stroke-width: 2.5; }
.line.scope { stroke: var(--base0D); } .line.done { stroke: var(--base0B); }
.lscope { fill: var(--base0D); font: 11px monospace; } .ldone { fill: var(--base0B); font: 11px monospace; }
.dot { fill: var(--base0D); opacity: .8; }
.rule { stroke-width: 1; stroke-dasharray: 4 3; } .rule.p50 { stroke: var(--base0B); } .rule.p85 { stroke: var(--base0A); } .rule.p95 { stroke: var(--base08); }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; background: var(--base01); border-radius: 6px; padding: 10px 14px 6px; width: 560px; }
.barcol { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
.barnum { font-size: 11px; color: var(--base05); } .barlabel { font-size: 10px; color: var(--base04); white-space: nowrap; }
.barfill { width: 100%; background: var(--base0B); border-radius: 3px 3px 0 0; min-height: 2px; }

/* matrix */
.matrix { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.mrow { display: grid; grid-template-columns: 90px repeat(5, minmax(150px, 1fr)); gap: 6px; }
.mcell { background: var(--base01); border-radius: 6px; min-height: 64px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.mcell.quickwin { background: color-mix(in srgb, var(--base0B) 12%, var(--base01)); outline: 1px dashed var(--base0B); }
.mhead .mcell { min-height: 0; background: none; color: var(--base04); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.mcell.mlabel { min-height: 0; font-weight: bold; align-items: flex-start; }
.mini { background: var(--base02); border-radius: 4px; padding: 2px 6px; font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini.current { outline: 2px solid var(--base0D); }

/* finder */
.finder { position: fixed; inset: 0; background: color-mix(in srgb, var(--base00) 70%, transparent); display: flex; justify-content: center; align-items: flex-start; padding-top: 10vh; z-index: 50; }
.finderbox { width: min(820px, 92vw); background: var(--base01); border: 1px solid var(--base03); border-radius: 10px; padding: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
.findhead { display: flex; gap: 12px; align-items: baseline; margin-bottom: 8px; }
.findmode { color: var(--base0B); font-weight: bold; font-size: 12px; letter-spacing: .06em; }
.finderbox input { width: 100%; background: var(--base02); color: var(--base05); border: 1px solid var(--base03); border-radius: 6px; font: inherit; font-size: 16px; padding: 8px 10px; outline: none; }
.finderbox input:focus { border-color: var(--base0D); }
.hits { margin-top: 8px; max-height: 52vh; overflow: auto; }
.hit { display: grid; grid-template-columns: 110px 1fr 90px; gap: 4px 12px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.hit.current { background: var(--base02); box-shadow: inset 3px 0 0 var(--base0D); }
.hitid { color: var(--base0D); font-family: ui-monospace, monospace; font-size: 12px; }
.hittitle { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hitfield { color: var(--base0E); font-size: 11px; text-align: right; }
.hitsnip { grid-column: 2 / 4; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hitnone, .findfoot { padding: 8px; font-size: 12px; }
.finderbox.wide { width: min(1100px, 94vw); max-height: 84vh; overflow: auto; }
.allkeys { columns: 3 320px; column-gap: 24px; margin-top: 8px; }
.keyrow { display: flex; gap: 12px; padding: 2px 0; break-inside: avoid; }
.keyrow .keys { color: var(--base0D); font-family: ui-monospace, monospace; min-width: 8.5em; }
@media (max-width: 1250px) { .hint:nth-child(n+8) { display: none; } }
@media (max-width: 1000px) { .hint:nth-child(n+5) { display: none; } .stats .stat:nth-child(n+4) { display: none; } }
@media (max-width: 760px) { .hints { display: none; } }

/* second top bar: every view */
.tabs { display: flex; align-items: stretch; background: var(--base00); border-bottom: 1px solid var(--base02); height: 32px; overflow: hidden; white-space: nowrap; }
.tab { display: flex; align-items: center; gap: 8px; padding: 0 14px; cursor: pointer; color: var(--base04); font-size: 12px; border-bottom: 2px solid transparent; }
.tab:hover { color: var(--base05); background: var(--base01); }
.tab .tabname { font-family: ui-monospace, monospace; letter-spacing: .04em; }
.tab .tabcount { background: var(--base02); color: var(--base05); border-radius: 999px; padding: 0 7px; font-size: 11px; }
.tab.current { color: var(--base05); background: var(--base01); border-bottom-color: var(--base0D); }
.tab.current .tabname { color: var(--base0D); font-weight: bold; }
.tab.current .stat { color: var(--base05); }
.tab.current .stat + .stat::before { content: "·"; color: var(--base04); margin-right: 8px; }
.zoomctl { color: var(--base0E); font-size: 12px; }
.zbtn { display: inline-block; width: 18px; text-align: center; border-radius: 4px; background: var(--base02); cursor: pointer; user-select: none; }
.wd.wmid { border-left-color: var(--base03); }

/* agent metrics */
.metrics { padding: 14px 18px; display: flex; flex-direction: column; gap: 18px; max-width: 1280px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.kpi { background: var(--base01); border-radius: 8px; padding: 10px 12px; border-left: 3px solid var(--base03); }
.kpi.good { border-left-color: var(--base0B); } .kpi.warn { border-left-color: var(--base0A); } .kpi.bad { border-left-color: var(--base08); }
.kpival { font-size: 26px; font-weight: 600; font-family: ui-monospace, monospace; }
.kpilabel { color: var(--base0E); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.kpinote { color: var(--base04); font-size: 11px; margin-top: 2px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
.panel { background: var(--base01); border-radius: 8px; padding: 10px 14px; }
.panel .ctitle { color: var(--base0E); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
.bars.small { height: 110px; width: auto; padding: 4px 0 0; background: none; }
.outcomes { display: flex; flex-direction: column; gap: 6px; }
.outrow { display: grid; grid-template-columns: 90px 1fr 80px; gap: 10px; align-items: center; font-size: 12px; }
.outtrack { display: flex; background: var(--base02); border-radius: 4px; height: 10px; overflow: hidden; }
.outfill { height: 100%; }
.out-success { background: var(--base0B); } .out-failure { background: var(--base08); } .out-partial { background: var(--base0A); } .out-blocked { background: var(--base0E); }
.outname.out-success { color: var(--base0B); background: none; } .outname.out-failure { color: var(--base08); background: none; } .outname.out-partial { color: var(--base0A); background: none; } .outname.out-blocked { color: var(--base0E); background: none; }
.aging { display: flex; flex-direction: column; gap: 4px; }
.agerow { display: grid; grid-template-columns: 90px 1fr 70px; gap: 10px; font-size: 12px; }
.late { color: var(--base08); }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
const app = Elm.Main.init({ node: document.getElementById("app") });
// the only link the app may open: the sponsor page
app.ports.openUrl.subscribe((u) => {
  if (typeof u === "string" && u.startsWith("https://github.com/sponsors/")) window.open(u, "_blank", "noopener,noreferrer");
});
</script>
</body>
</html>
