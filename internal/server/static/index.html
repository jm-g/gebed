<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gebed</title>
<style>
:root {
  --base00: #1e1e2e; --base01: #181825; --base02: #313244; --base03: #45475a;
  --base04: #585b70; --base05: #cdd6f4; --base08: #f38ba8; --base0A: #f9e2af;
  --base0B: #a6e3a1; --base0D: #89b4fa;
}
body { margin: 0; background: var(--base00); color: var(--base05); font: 14px monospace; }
.app { display: flex; height: 100vh; }
.sidebar { width: 14em; background: var(--base01); padding: .5em; overflow: auto; }
.main { flex: 1; padding: .5em; overflow: auto; }
ul { list-style: none; margin: 0; padding: 0; }
li { padding: .15em .4em; cursor: default; }
li.current { background: var(--base02); }
.beads li { display: flex; gap: 1em; }
.id { color: var(--base0D); } .status { color: var(--base0A); width: 8em; }
.prio { color: var(--base08); } .dim { color: var(--base04); } .error { color: var(--base08); }
body { overflow: hidden; }
.kanban { display: flex; gap: .5em; align-items: flex-start; }
.col { min-width: 16em; background: var(--base01); padding: .4em; }
.colhead { color: var(--base0A); margin-bottom: .4em; }
.card { background: var(--base02); padding: .3em .4em; margin-bottom: .4em; }
.card.current { outline: 1px solid var(--base0D); }
.whichkey { position: fixed; left: 0; right: 0; bottom: 0; background: var(--base02); padding: .5em 1em; display: flex; flex-wrap: wrap; gap: 1.5em; }
.wk .key { color: var(--base0D); }
.detail { width: 38em; background: var(--base01); padding: .5em .8em; overflow: auto; border-left: 1px solid var(--base02); }
.dtitle { font-weight: bold; margin-bottom: .2em; }
.dmeta { margin-bottom: .2em; }
.ddesc { white-space: pre-wrap; margin: .5em 0; padding: .4em; background: var(--base02); }
.discussion { margin-top: .6em; }
.comment { margin-bottom: .6em; }
.author { color: var(--base0B); }
.ctext { white-space: pre-wrap; }
.hint { margin-top: .8em; }
.composer { margin-top: .8em; }
.composer textarea { width: 100%; box-sizing: border-box; background: var(--base02); color: var(--base05); border: 1px solid var(--base03); font: inherit; padding: .4em; }
.chip { color: var(--base0D); cursor: pointer; margin-right: .6em; }
.edge { stroke: var(--base04); fill: none; stroke-width: 1.5; }
.edge.soft { stroke-dasharray: 4 3; }
.gnode { fill: var(--base01); stroke: var(--base03); }
.gnode.current { stroke: var(--base0D); stroke-width: 2; }
.gid { fill: var(--base0D); font: 11px monospace; }
.gtitle { fill: var(--base05); font: 12px monospace; }
.gext { fill: var(--base0E); font: 10px monospace; }
.wrow { display: flex; align-items: center; padding: 2px 0; }
.wrow.current { background: var(--base02); }
.wlabel { width: 24em; flex: none; white-space: nowrap; overflow: hidden; }
.wtrack { flex: 1; position: relative; height: 14px; background: var(--base01); }
.wbar { position: absolute; height: 100%; }
.wbar.todo { background: var(--base0D); }
.wbar.doing { background: var(--base0A); }
.wbar.done { background: var(--base0B); }
.wbar.blocked { background: var(--base08); }
.flash { position: fixed; right: 1em; bottom: 3em; background: var(--base02); color: var(--base0B); padding: .4em .8em; border-left: 3px solid var(--base0B); }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>Elm.Main.init({ node: document.getElementById("app") });</script>
</body>
</html>
